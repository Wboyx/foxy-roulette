name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: keepalive
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: نگه‌داشتن گره فرانکفورت
        run: |
          for i in 1 2; do
            curl -s -m 20 -o /dev/null -w "ping%{http_code}\n" https://foxy-de-node.onrender.com/health || true
            sleep 5
          done
