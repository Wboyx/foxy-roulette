name: tr-hunt
on:
  schedule:
    - cron: "23 */8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tr-hunt

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: شکار ترکیه
        run: python3 tr_hunt.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
