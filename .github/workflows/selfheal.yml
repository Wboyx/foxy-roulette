name: selfheal
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: selfheal
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq curl unzip
      - name: تست + ترمیم خودکار (هر لوکیشن)
        run: python3 selfheal.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: ثبت وضعیت
        run: |
          git config user.name "foxy-bot"
          git config user.email "foxy-bot@users.noreply.github.com"
          git add health-status.json de-nodes.json
          git diff --cached --quiet || (git commit -m "selfheal: update" && git push)
